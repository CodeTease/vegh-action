name: ☁️ Vegh Production Smoke Test (@v1.5)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  smoke-test-release:
    name: Verify Release Version (@v1.5)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: 🍳 Cook some data
        run: |
          mkdir -p production_data/src
          echo "def main(): pass" > production_data/src/main.py
          echo "console.log('Production is hard');" > production_data/src/index.js
          echo "This is a serious file." > production_data/README.md
          
          find production_data -type f -exec md5sum {} + | sort > original_prod.sum

      - name: 🛡️ Test Security Audit (Production)
        uses: codetease/vegh-action@v1.5
        with:
          command: 'audit'
          path: './production_data'

      - name: 📊 Test LOC (Production)
        id: vegh-loc
        uses: codetease/vegh-action@v1.5
        with:
          command: 'loc'
          path: './production_data'

      - name: 📉 Test SLOC (Production)
        id: vegh-sloc
        uses: codetease/vegh-action@v1.5
        with:
          command: 'loc'
          path: './production_data'
          sloc: 'true'

      - name: Inspect Report
        run: |
          echo "::notice::Production Report:"
          echo "${{ steps.vegh-loc.outputs.loc-report }}"

      - name: 🤖 Test Prompt (AI Context)
        id: vegh-prompt
        uses: codetease/vegh-action@v1.5
        with:
          command: 'prompt'
          path: './production_data'
          clean: 'true'

      - name: 📦 Test Snap (Production)
        uses: codetease/vegh-action@v1.5
        with:
          command: 'snap'
          path: './production_data'
          output: 'release-test.vegh'
          comment: 'Smoke Test via @v1.5 Tag'

      - name: ✅ Test Integrity Check
        uses: codetease/vegh-action@v1.5
        with:
          command: 'check'
          path: 'release-test.vegh'

      - name: ♻️ Test Restore (Production)
        uses: codetease/vegh-action@v1.5
        with:
          command: 'restore'
          path: 'release-test.vegh'
          output: './restored_prod'

      - name: 🕵️ Validate Production Integrity
        run: |
          echo "Verifying if @v1.5 is strictly business..."
          
          find restored_prod -type f -exec md5sum {} + | sort > restored_prod.sum
          
          sed -i 's/production_data\///g' original_prod.sum
          sed -i 's/restored_prod\///g' restored_prod.sum
          
          if diff original_prod.sum restored_prod.sum; then
            echo "✅ SMOKE TEST PASSED: The @v1.5 tag is safe to consume."
          else
            echo "🔥 SMOKE TEST FAILED: The @v1.5 tag is broken!"
            exit 1
          fi
